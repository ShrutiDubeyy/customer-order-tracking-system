<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Dashboard')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
  <h1>Dashboard</h1>
  <div th:replace="~{fragments :: messages}"></div>
  <div class="cards">
    <div class="card"><div class="num" id="count-items" th:text="${itemCount}">0</div>Items in catalogue</div>
    <div class="card warn"><div class="num" id="count-lowstock" th:text="${lowStockCount}">0</div>Low-stock items</div>
  </div>
</main>
</body>
</html>
