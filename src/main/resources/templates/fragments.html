<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' | Order Tracker'">Order Tracker</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="nav" th:fragment="nav">
  <span class="brand">Order Tracker</span>
  <a id="nav-home" th:href="@{/}">Dashboard</a>
  <a id="nav-items" th:href="@{/items}">Items</a>
  <span class="env" id="env" th:text="${env}">local</span>
</header>
<div th:fragment="messages">
  <div id="msg-ok" class="ok" th:if="${message}" th:text="${message}"></div>
  <div id="msg-error" class="error" th:if="${error}" th:text="${error}"></div>
</div>
</body>
</html>
