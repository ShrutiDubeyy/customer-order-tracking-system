<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Items')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
  <h1>Item catalogue</h1>
  <div th:replace="~{fragments :: messages}"></div>
  <form class="filters" th:action="@{/items}" method="get">
    <div><label for="q">Search name or SKU</label><input type="text" id="q" name="q" th:value="${q}"></div>
    <button type="submit" id="search-btn">Search</button>
    <a class="btn" id="add-item" th:href="@{/items/new}">+ Add item</a>
  </form>
  <table id="items-table">
    <tr><th>SKU</th><th>Name</th><th>Price</th><th>Stock</th><th>Reorder level</th><th></th></tr>
    <tr th:each="i : ${items}">
      <td th:text="${i.sku}">-</td>
      <td th:text="${i.name}">-</td>
      <td th:text="${i.price}">0</td>
      <td th:text="${i.stock}" th:classappend="${i.lowStock} ? 'low'">0</td>
      <td th:text="${i.reorderLevel}">0</td>
      <td><a th:href="@{/items/{id}/edit(id=${i.id})}">Edit</a></td>
    </tr>
  </table>
</main>
</body>
</html>
