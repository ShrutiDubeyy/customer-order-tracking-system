<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Track order')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
  <h1>Track an order</h1>
  <form th:action="@{/track}" method="get">
    <label for="id">Order ID</label>
    <input type="number" id="id" name="id" min="1" required>
    <button type="submit" id="track-btn">Track</button>
  </form>
  <div th:replace="~{fragments :: messages}"></div>
  <table th:if="${order}" id="track-result">
    <tr><th>Order ID</th><td th:text="${order.id}">1</td></tr>
    <tr><th>Customer</th><td th:text="${order.customerName}">-</td></tr>
    <tr><th>Item</th><td th:text="${order.item.name}">-</td></tr>
    <tr><th>Status</th><td><span id="track-status" th:text="${order.status}" th:class="'badge ' + ${order.status}">PLACED</span></td></tr>
    <tr><th>Last updated</th><td th:text="${order.updatedAtText}">-</td></tr>
  </table>
</main>
</body>
</html>
