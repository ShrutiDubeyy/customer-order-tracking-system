spring.application.name=order-tracker
server.port=${PORT:8080}

# Environment name shown in the page footer (parameterised for the Jenkins pipeline)
app.environment=${APP_ENV:local}

# An active order not updated for this many hours raises a "delayed order" alert
app.alerts.delay-hours=48

# Default database: in-memory H2 (no installation needed). Use --spring.profiles.active=mysql for MySQL.
spring.datasource.url=jdbc:h2:mem:ordertracker;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

management.endpoints.web.exposure.include=health,info
